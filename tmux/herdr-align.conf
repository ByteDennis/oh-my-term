# 把 tmux 的销毁性键位对齐到 herdr。
#
# 故意做成一个小的叠加文件，而不是替换你那份 ~/.tmux.conf ——
# 那份是好的，只有四个键需要动，整份重写只会引入风险。
#
# 用法：在 ~/.tmux.conf 末尾（TPM 那行之前）加一句
#     source-file ~/path/to/oh-my-term/tmux/herdr-align.conf
#
# 对齐后的结果（两边完全一致）：
#     prefix+w         workspace / session 选择器   ← 无害
#     prefix+x         关 pane
#     prefix+shift+x   关 tab / window
#     prefix+shift+d   关 workspace / session

# ── 先解掉旧绑定 ──
unbind p          # 原来的 kill-pane
unbind x          # 原来的 kill-window
unbind X          # 原来的 kill-session

# ── 重新绑定 ──
# prefix+w 保持 choose-session 不动，它和 herdr 的 workspace_picker 已经一致。

# 关 pane：单个 pane，风险低，不确认，和 herdr 的 close_pane 一致
bind x kill-pane

# 关 window：会连带关掉里面所有 pane，要确认
bind X confirm-before -p "kill window #W? (y/n)" kill-window

# 关 session：整个端掉，要确认
bind D confirm-before -p "kill session #S? (y/n)" kill-session

# ── workspace / session 切换，对齐 herdr 的 next/previous_workspace ──
unbind N
unbind B
bind C-j switch-client -n
bind C-k switch-client -p

# ── 新建 session，对齐 herdr 的 new_workspace = prefix+shift+c ──
bind C new-session

# tmux 默认的 prefix+q 是「显示 pane 编号」，herdr 里 prefix+q 没有绑定，
# 所以这里不动它，留着。
